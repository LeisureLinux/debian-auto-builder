name: Automated Debian Gap Scanner

on:
  push:
    branches: [ main ]
    paths:
      - 'tracked.json'
      - '.github/workflows/**'
      - 'main.go'
      - 'go.mod'

  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动扫描缺口
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:
  scan-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run auto-scan (CLI)
        id: scan
        # Exit code 1 from the scanner signals that at least one gap was detected.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.BUILDER_PAT }}
        run: |
          set +e
          go run . -scan tracked.json > scan-result.json
          code=$?
          set -e
          echo "scanner exit code: $code"
          # Only mark gap_detected when the scanner actually reported gaps (exit 1).
          if [ "$code" -eq 1 ]; then
            echo "gap_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "gap_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show scan results
        run: |
          echo "Scan results:"
          cat scan-result.json || true
          # Count packages vs gaps
          echo "Packages scanned: $(jq length scan-result.json 2>/dev/null || echo unknown)"

      - name: Trigger deb-builder when gaps found
        if: steps.scan.outputs.gap_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BUILDER_PAT }}
        run: |
          echo "⚠️ Gaps detected! Dispatching build to deb-builder..."
          curl -X POST https://api.github.com/repos/LeisureLinux/deb-builder/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"event_type":"auto-build-required","client_payload":{"source":"debian-auto-builder","arch":"amd64,arm64"}}'

      - name: Notify on gap detection
        if: steps.scan.outputs.gap_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: "⚠️ Debian Architecture Gap Detected",
              body: `Automated scan detected package(s) missing .deb builds. See the workflow logs for details.`
            })
