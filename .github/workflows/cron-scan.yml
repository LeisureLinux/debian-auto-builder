name: Automated Debian Gap Scanner

on:
  push:
    branches: [ main ]
    paths:
      - 'tracked.json'
      - '.github/workflows/**'
      - 'main.go'
      - 'go.mod'

  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动扫描缺口
    - cron: '0 2 * * *'

  workflow_dispatch:

# Notify 步骤要创建/评论 issue
permissions:
  contents: read
  issues: write

jobs:
  scan-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run auto-scan (CLI)
        id: scan
        # Exit code 1 from the scanner signals that at least one gap was detected.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.BUILDER_PAT }}
        run: |
          set +e
          # 拉取 deb-builder 的禁用清单，从本次扫描中剔除这些包：
          # 它们的 recipe 已禁用（disabled: true），派发构建也只会被干净跳过，
          # 不剔除会导致每日重复派发+重复报缺口。
          if curl -fsSL https://raw.githubusercontent.com/LeisureLinux/deb-builder/main/disabled.txt \
              | grep -v '^#' | sed '/^$/d' > /tmp/disabled.txt; then
            jq --rawfile dis /tmp/disabled.txt \
               'map(select(.package as $p | ($dis | split("\n") | map(select(length>0)) | index($p)) | not))' \
               tracked.json > /tmp/tracked-effective.json
            echo "已剔除 $(($(jq length tracked.json) - $(jq length /tmp/tracked-effective.json))) 个禁用包"
          else
            echo "⚠️ 无法获取禁用清单，按全量 tracked.json 扫描"
            cp tracked.json /tmp/tracked-effective.json
          fi
          go run . -scan /tmp/tracked-effective.json > scan-result.json
          code=$?
          set -e
          echo "scanner exit code: $code"
          # Only mark gap_detected when the scanner actually reported gaps (exit 1).
          if [ "$code" -eq 1 ]; then
            echo "gap_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "gap_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show scan results
        run: |
          echo "Scan results:"
          cat scan-result.json || true
          # Count packages vs gaps
          echo "Packages scanned: $(jq length scan-result.json 2>/dev/null || echo unknown)"

      - name: Gap summary (dispatched per-package by scanner)
        if: steps.scan.outputs.gap_detected == 'true'
        run: |
          # 缺口包已由 Go 扫描器在 scan 阶段逐个 repository_dispatch 到 deb-builder；
          # 此处只做汇总展示。注意：不要在这里再发不带 package 的 dispatch——
          # 那会让 receive-trigger 进入 auto 模式全量构建所有 recipe（已踩过坑）。
          echo "⚠️ 以下缺口包已逐个派发构建："
          jq -r '.[] | select(.gap_detected) | .package' scan-result.json || true

      - name: Notify on gap detection
        if: steps.scan.outputs.gap_detected == 'true'
        # 仓库级 Actions 令牌权限被设为只读(read)，默认 GITHUB_TOKEN 建 issue 会 403。
        # 改用 BUILDER_PAT（对 debian-auto-builder 有 issues 权限）并加 continue-on-error，
        # 即便通知仍失败也不拖垮整 job 导致每日失败邮件。
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BUILDER_PAT }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let gaps = [];
            try {
              gaps = JSON.parse(fs.readFileSync('scan-result.json', 'utf8'))
                .filter(r => r.gap_detected).map(r => r.package);
            } catch (e) {}
            const gapList = gaps.length ? gaps.join(', ') : '(详见 workflow 日志)';
            const TITLE = '⚠️ Debian Architecture Gap Detected';
            const body = `**${new Date().toISOString().slice(0, 10)} 扫描**发现缺口包：${gapList}\n\n构建结果见 [deb-builder Actions](https://github.com/LeisureLinux/deb-builder/actions?query=event%3Arepository_dispatch)`;
            // 去重：已有同名 open issue 则追加评论，否则新建，避免每天开新帖
            const { data: opens } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = opens.find(i => i.title === TITLE);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              console.log(`commented on existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body });
              console.log('created new gap issue');
            }
